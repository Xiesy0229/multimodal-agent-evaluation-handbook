name: Daily multimodal model news

on:
  schedule:
    # 19:30 Asia/Shanghai (11:30 UTC)
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch three multimodal items
        run: python scripts/fetch_multimodal_news.py

      - name: Commit the daily note when it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily-learning/*-multimodal-news.md
          if git diff --cached --quiet; then
            echo "No new daily note to commit."
            exit 0
          fi
          git commit -m "docs: add daily multimodal model news"
          git push
