<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R2V Arena 15题维度验证</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c18;
      --surface: #0f1628;
      --surface-2: #151e34;
      --surface-3: #1b2741;
      --text: #eef3ff;
      --muted: #9ba9c6;
      --line: #2a3858;
      --blue: #55b9ff;
      --green: #44d39a;
      --red: #ff7d8b;
      --yellow: #f6c85f;
      --violet: #9c83ff;
      --shadow: 0 16px 48px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #111a33 0, var(--bg) 420px);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(8, 12, 24, .92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 500; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .top-actions, .inline, .tabs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .button {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
    }
    .button:hover { background: var(--surface-3); }
    .button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .button.ghost { background: transparent; }
    .button:disabled { opacity: .42; cursor: default; }
    .layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100vh - 74px); }
    .sidebar {
      position: sticky;
      top: 74px;
      height: calc(100vh - 74px);
      overflow: auto;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: rgba(10, 15, 28, .72);
    }
    .progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .progress { height: 6px; margin: 8px 0 18px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--green); width: 0; transition: width .2s; }
    .question-nav { display: grid; gap: 6px; }
    .qnav {
      width: 100%;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 10px;
      align-items: center;
      gap: 8px;
      padding: 9px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .qnav:hover, .qnav.active { background: var(--surface-2); }
    .qnav .index { color: var(--muted); font-variant-numeric: tabular-nums; }
    .qnav .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .qnav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .qnav.done .dot { background: var(--green); }
    main { min-width: 0; padding: 22px clamp(18px, 3vw, 38px) 80px; }
    .tabs { margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .tab {
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      background: transparent;
      padding: 10px 4px;
      margin-right: 16px;
    }
    .tab.active { color: var(--text); border-color: var(--blue); }
    .panel[hidden] { display: none; }
    .question-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 18px;
    }
    .eyebrow { color: var(--blue); font-size: 12px; margin-bottom: 5px; }
    h2 { margin: 0; font-size: 24px; font-weight: 500; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .tag { padding: 3px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 11px; }
    .question-switch { display: flex; gap: 8px; }
    .question-switch button { min-width: 42px; font-size: 18px; }
    .prompt-group { display: grid; gap: 10px; margin-bottom: 18px; }
    .prompt {
      margin: 0;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: #cbd6ed;
      white-space: pre-wrap;
      max-height: 180px;
      overflow: auto;
      font-size: 13px;
    }
    .prompt.zh { color: var(--text); font-size: 14px; }
    .prompt-label {
      display: block;
      margin-bottom: 6px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 500;
    }
    .prompt.en .prompt-label { color: var(--muted); }
    .section-title { margin: 26px 0 12px; font-size: 15px; font-weight: 500; }
    .references { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .reference { margin: 0; min-width: 0; }
    .reference img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block; background: #05070d; border-radius: 6px; border: 1px solid var(--line); }
    .reference figcaption { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .videos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .video-panel { min-width: 0; }
    .video-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 13px; }
    .video-title span:last-child { color: var(--muted); }
    video { display: block; width: 100%; max-height: 460px; background: #000; border: 1px solid var(--line); border-radius: 7px; }
    .evaluation { margin-top: 28px; }
    .dimension {
      border-top: 1px solid var(--line);
      padding: 16px 0;
    }
    .dimension:last-child { border-bottom: 1px solid var(--line); }
    .dimension-head { display: grid; grid-template-columns: minmax(300px, .9fr) minmax(420px, 1.1fr); gap: 18px; align-items: center; }
    .dimension-title { font-weight: 500; }
    .dimension-desc { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .sub-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 10px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .sub-hints span::before { content: "· "; color: var(--line); }
    .verdicts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .verdict {
      min-height: 42px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px;
      line-height: 1.25;
    }
    .verdict:hover { background: var(--surface-2); color: var(--text); }
    .verdict.selected[data-value="A"] { background: rgba(85,185,255,.16); border-color: var(--blue); color: #bfe5ff; }
    .verdict.selected[data-value="SameGood"] { background: rgba(68,211,154,.14); border-color: var(--green); color: #aaf1d3; }
    .verdict.selected[data-value="SameBad"] { background: rgba(246,200,95,.14); border-color: var(--yellow); color: #ffe3a3; }
    .verdict.selected[data-value="B"] { background: rgba(156,131,255,.16); border-color: var(--violet); color: #d4c8ff; }
    .overall {
      margin-top: 18px;
      padding: 18px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .overall .dimension-head { grid-template-columns: minmax(300px, .9fr) minmax(420px, 1.1fr); }
    .dimension-feedback {
      margin-top: 18px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .feedback-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .feedback-title { font-weight: 500; }
    .feedback-subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .feedback-statuses { display: flex; gap: 7px; flex: 0 0 auto; }
    .feedback-status, .feedback-chip {
      min-height: 36px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 6px;
      padding: 7px 11px;
    }
    .feedback-status:hover, .feedback-chip:hover { color: var(--text); border-color: #48536a; }
    .feedback-status.selected, .feedback-chip.selected {
      color: #bfe5ff;
      border-color: var(--blue);
      background: rgba(85,185,255,.13);
    }
    .feedback-status.issue.selected {
      color: #ffe3a3;
      border-color: var(--yellow);
      background: rgba(246,200,95,.12);
    }
    .feedback-details {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 16px;
    }
    .feedback-details[hidden] { display: none; }
    .feedback-field { display: grid; gap: 8px; }
    .feedback-field[hidden] { display: none; }
    .feedback-label { color: var(--text); font-size: 12px; font-weight: 500; }
    .feedback-label span { color: var(--muted); font-weight: 400; }
    .feedback-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .feedback-subdimensions { display: grid; gap: 10px; }
    .feedback-subgroup {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
    }
    .feedback-subgroup-title {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 500;
    }
    .feedback-subgroup .feedback-chip { background: var(--surface); }
    .feedback-subgroup .feedback-chip.selected {
      color: #aaf1d3;
      border-color: var(--green);
      background: rgba(68,211,154,.12);
    }
    .feedback-input, .feedback-note {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      outline: none;
    }
    .feedback-input:focus, .feedback-note:focus { border-color: var(--blue); }
    .feedback-note { min-height: 86px; resize: vertical; }
    .feedback-saved { color: var(--muted); font-size: 11px; }
    .summary-lead { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { margin-top: 5px; font-size: 22px; font-variant-numeric: tabular-nums; }
    .winner-a { color: var(--blue); }
    .winner-b { color: var(--violet); }
    .winner-tie { color: var(--yellow); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 10px 9px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 500; }
    .dimension-guide { display: grid; gap: 14px; }
    .guide-group { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .guide-group h3 { margin: 0 0 8px; font-size: 15px; font-weight: 500; }
    .guide-group p { margin: 4px 0; color: var(--muted); font-size: 12px; }
    .guide-group b { color: var(--text); font-weight: 500; }
    .status { color: var(--muted); font-size: 12px; margin-left: auto; }
    .blind .model-name { filter: blur(5px); user-select: none; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .question-nav { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .qnav { grid-template-columns: 1fr 10px; }
      .qnav .index { display: none; }
      .dimension-head, .overall .dimension-head { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .question-head { flex-direction: column; }
      .question-switch { width: 100%; }
      .question-switch button { flex: 1; min-width: 0; white-space: nowrap; }
      .feedback-head { align-items: stretch; flex-direction: column; }
      .feedback-statuses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .videos, .summary-lead { grid-template-columns: 1fr; }
      .verdicts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .question-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      main { padding-inline: 14px; }
    }
  </style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <h1>R2V Arena 15题维度验证</h1>
      <p>仅含 Arena 双视频题，用于检查维度是否适用</p>
    </div>
    <div class="top-actions">
      <button id="syncPlay" class="button" title="同步播放或暂停两段视频">同步</button>
      <button id="blindToggle" class="button ghost" title="隐藏或显示模型名称">盲评</button>
      <button id="exportCsv" class="button primary" title="导出全部评分与维度反馈">导出完整 CSV</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="progress-label"><span>标注进度</span><strong id="progressText">0 / 15</strong></div>
      <div class="progress"><div id="progressBar"></div></div>
      <nav id="questionNav" class="question-nav" aria-label="题目"></nav>
    </aside>
    <main>
      <div class="tabs" role="tablist">
        <button class="tab active" data-panel="evaluate">逐题验证</button>
        <button class="tab" data-panel="summary">GSB汇总</button>
        <button class="tab" data-panel="guide">维度说明</button>
        <span id="saveStatus" class="status">自动保存于本机浏览器</span>
      </div>
      <section id="evaluatePanel" class="panel">
        <div id="questionView"></div>
      </section>
      <section id="summaryPanel" class="panel" hidden>
        <div id="summaryView"></div>
      </section>
      <section id="guidePanel" class="panel" hidden>
        <div id="guideView"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
</div>

function createVideoUrl(dataUrl) {
  if (!dataUrl.startsWith('data:')) return dataUrl;
  const comma = dataUrl.indexOf(',');
  const binary = atob(dataUrl.slice(comma + 1));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], {type:'video/mp4'}));
  activeVideoUrls.push(url);
  return url;
}

function blankResult(question) {
  const dimensions = {};
  DIMENSIONS.forEach(dim => {
    dimensions[dim.id] = {verdict:'', reasons:[], note:''};
  });
  dimensions.overall = {verdict:'', reasons:[], note:'', auto:true};
  return {dimensions, questionNote:'', dimensionFeedback:blankDimensionFeedback()};
}
function blankDimensionFeedback() {
  return {status:'', issueTypes:[], dimensionIds:[], subdimensionIds:[], suggestedDimension:'', note:''};
}
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && saved.version === 5) return saved;
  } catch(e) {}
  const results = {};
  DATA.questions.forEach(q => results[q.id] = blankResult(q));
  return {version:5, current:0, blind:false, results};
}
function ensureState() {

    if (!state.results[q.id]) state.results[q.id] = blankResult(q);
    const feedback = state.results[q.id].dimensionFeedback;
    if (!feedback || typeof feedback !== 'object') {
      state.results[q.id].dimensionFeedback = blankDimensionFeedback();
    } else {
      if (!['','no_issue','issue'].includes(feedback.status)) feedback.status = '';
      if (!Array.isArray(feedback.issueTypes)) feedback.issueTypes = [];
      if (!Array.isArray(feedback.dimensionIds)) feedback.dimensionIds = [];
      if (!Array.isArray(feedback.subdimensionIds)) feedback.subdimensionIds = [];
      if (typeof feedback.suggestedDimension !== 'string') feedback.suggestedDimension = '';
      if (typeof feedback.note !== 'string') feedback.note = '';
    }
    [...DIMENSIONS, OVERALL].forEach(dim => {
      if (!state.results[q.id].dimensions[dim.id]) {

      const result = state.results[q.id].dimensions[dim.id];
      if (dim.id === 'overall' && typeof result.auto !== 'boolean') result.auto = true;
      if (result.verdict === 'AG') result.verdict = 'SameGood';
      if (result.verdict === 'AB') result.verdict = 'SameBad';
      if (result.verdict === 'NA') result.verdict = '';
      result.reasons = [];
      result.note = '';
    });
  });
}
function saveState() {
  state.current = current;
  state.blind = blind;
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  const status = document.getElementById('saveStatus');
  status.textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function dimensionApplies(q, dim) {
  return true;
}
function inferOverall(q) {
  const results = state.results[q.id].dimensions;
  const applicable = DIMENSIONS.filter(dim => dimensionApplies(q,dim));
  const values = applicable.map(dim => results[dim.id].verdict);
  if (values.some(value => !value)) return '';
  const counts = values.reduce((acc,value) => {
    acc[value] = (acc[value] || 0) + 1;
    return acc;
  }, {});
  if ((counts.A || 0) > (counts.B || 0)) return 'A';
  if ((counts.B || 0) > (counts.A || 0)) return 'B';
  if ((counts.SameBad || 0) > (counts.SameGood || 0)) return 'SameBad';
  return 'SameGood';
}
function questionComplete(q) {
  const dims = state.results[q.id].dimensions;
  return [...DIMENSIONS.filter(dim => dimensionApplies(q,dim)), OVERALL].every(dim => !!dims[dim.id].verdict);
}

}
function verdictButtons(qid, dimId) {

function dimensionHtml(q, dim) {

}
function dimensionFeedbackHtml(q) {

function feedbackSubdimensionsHtml(feedback) {
  return feedback.dimensionIds.map(dimId => {
    const dim = DIMENSIONS.find(item => item.id === dimId);

    return `<div class="feedback-subgroup">

      <div class="feedback-chips">${dim.subs.map(([subId,name,desc]) => {

      }).join('')}</div>

  }).join('');
}

      <div class="video-panel"><div class="video-title"><b>模型 B</b><span class="model-name">${escapeHtml(DATA.models.b)}</span></div><video id="videoB" controls playsinline preload="metadata" src="${videoBUrl}"></video></div>

        <div class="dimension-head">
          <div>
            <div class="dimension-title" title="${escapeHtml(OVERALL.desc)}">${OVERALL.name}</div>
            <div class="dimension-desc">${state.results[q.id].dimensions.overall.auto ? '一级维度选完后自动生成，可手动调整' : '已人工调整；修改一级维度后将重新自动计算'}</div>

function bindQuestionEvents(q) {
  document.getElementById('prevQuestion').onclick = () => { current = Math.max(0,current-1); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
  document.getElementById('nextQuestion').onclick = () => { current = Math.min(DATA.questions.length-1,current+1); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
  document.querySelectorAll('.verdict').forEach(btn => btn.onclick = () => {
    const res = state.results[q.id].dimensions[btn.dataset.dim];
    res.verdict = btn.dataset.value;
    if (btn.dataset.dim === 'overall') {
      res.auto = false;
    } else {
      const overall = state.results[q.id].dimensions.overall;
      overall.verdict = inferOverall(q);
      overall.auto = true;
    }
    saveState(); renderAll();
  });
  document.querySelectorAll('[data-feedback-status]').forEach(btn => btn.onclick = () => {
    const feedback = state.results[q.id].dimensionFeedback;
    feedback.status = btn.dataset.feedbackStatus;
    if (feedback.status === 'no_issue') {
      feedback.issueTypes = [];
      feedback.dimensionIds = [];
      feedback.subdimensionIds = [];
      feedback.suggestedDimension = '';
      feedback.note = '';
      document.querySelectorAll('[data-feedback-issue],[data-feedback-dimension],[data-feedback-subdimension]').forEach(item => {
        item.classList.remove('selected');
        item.setAttribute('aria-pressed','false');
      });
      const suggestedInput = document.getElementById('suggestedDimension');
      const noteInput = document.getElementById('dimensionFeedbackNote');
      if (suggestedInput) suggestedInput.value = '';
      if (noteInput) noteInput.value = '';
    }
    document.querySelectorAll('[data-feedback-status]').forEach(item => {
      const selected = item.dataset.feedbackStatus === feedback.status;
      item.classList.toggle('selected', selected);
      item.setAttribute('aria-pressed', String(selected));
    });
    document.querySelector('.feedback-details').hidden = feedback.status !== 'issue';
    saveState();
  });
  document.querySelectorAll('[data-feedback-issue]').forEach(btn => btn.onclick = () => {
    const feedback = state.results[q.id].dimensionFeedback;
    const id = btn.dataset.feedbackIssue;
    feedback.issueTypes = feedback.issueTypes.includes(id)
      ? feedback.issueTypes.filter(item => item !== id)
      : [...feedback.issueTypes,id];
    const selected = feedback.issueTypes.includes(id);
    btn.classList.toggle('selected', selected);
    btn.setAttribute('aria-pressed', String(selected));
    saveState();
  });
  document.querySelectorAll('[data-feedback-dimension]').forEach(btn => btn.onclick = () => {
    const feedback = state.results[q.id].dimensionFeedback;
    const id = btn.dataset.feedbackDimension;
    if (feedback.dimensionIds.includes(id)) {
      feedback.dimensionIds = feedback.dimensionIds.filter(item => item !== id);
      feedback.subdimensionIds = feedback.subdimensionIds.filter(item => !item.startsWith(id + ':'));
    } else {
      feedback.dimensionIds = [...feedback.dimensionIds,id];
    }
    const selected = feedback.dimensionIds.includes(id);
    btn.classList.toggle('selected', selected);
    btn.setAttribute('aria-pressed', String(selected));
    const subdimensionField = document.getElementById('subdimensionField');
    const subdimensions = document.getElementById('feedbackSubdimensions');
    subdimensionField.hidden = feedback.dimensionIds.length === 0;
    subdimensions.innerHTML = feedbackSubdimensionsHtml(feedback);
    bindSubdimensionEvents(q);
    saveState();
  });
  bindSubdimensionEvents(q);
  const suggestedDimension = document.getElementById('suggestedDimension');
  const dimensionFeedbackNote = document.getElementById('dimensionFeedbackNote');
  if (suggestedDimension) suggestedDimension.oninput = () => {
    state.results[q.id].dimensionFeedback.suggestedDimension = suggestedDimension.value;
    saveState();
  };
  if (dimensionFeedbackNote) dimensionFeedbackNote.oninput = () => {
    state.results[q.id].dimensionFeedback.note = dimensionFeedbackNote.value;
    saveState();
  };
}
function bindSubdimensionEvents(q) {
  document.querySelectorAll('[data-feedback-subdimension]').forEach(btn => btn.onclick = () => {
    const feedback = state.results[q.id].dimensionFeedback;
    const id = btn.dataset.feedbackSubdimension;
    feedback.subdimensionIds = feedback.subdimensionIds.includes(id)
      ? feedback.subdimensionIds.filter(item => item !== id)
      : [...feedback.subdimensionIds,id];
    const selected = feedback.subdimensionIds.includes(id);
    btn.classList.toggle('selected', selected);
    btn.setAttribute('aria-pressed', String(selected));
    saveState();
  });
}
function statsFor(dimId) {
  const counts = {A:0,B:0,SameBad:0,SameGood:0,blank:0};
  DATA.questions.forEach(q => {
    const dim = [...DIMENSIONS,OVERALL].find(item => item.id === dimId);
    if (dim && !dimensionApplies(q,dim)) return;
    const v = state.results[q.id].dimensions[dimId].verdict || 'blank';
    counts[v]++;
  });
  const similar = counts.SameGood + counts.SameBad;
  const denominator = counts.A + .5 * similar;
  const numerator = counts.B + .5 * similar;
  const gsb = denominator === 0 ? (numerator > 0 ? Infinity : null) : numerator / denominator;
  return {...counts, similar, gsb, valid: counts.A+counts.B+counts.SameBad+counts.SameGood};
}
function winnerFromGsb(gsb) {
  if (gsb === null) return ['尚无结果','winner-tie'];
  if (!Number.isFinite(gsb) || gsb > 1) return [DATA.models.b + ' 占优','winner-b'];
  if (gsb < 1) return [DATA.models.a + ' 占优','winner-a'];
  return ['两模型持平','winner-tie'];
}
function formatGsb(value) {
  if (value === null) return '—';
  if (!Number.isFinite(value)) return '∞';
  return value.toFixed(2);
}
function renderSummary() {
  const overall = statsFor('overall');
  const [winner,winnerClass] = winnerFromGsb(overall.gsb);
  const completed = DATA.questions.filter(questionComplete).length;
  const rows = [...DIMENSIONS,OVERALL].map(dim => {
    const s=statsFor(dim.id);
    return `<tr><td>${dim.name}</td><td>${s.valid}</td><td>${s.A}</td><td>${s.B}</td><td>${s.SameBad}</td><td>${s.SameGood}</td><td>${s.similar}</td><td>${formatGsb(s.gsb)}</td><td>${winnerFromGsb(s.gsb)[0]}</td></tr>`;
  }).join('');
  document.getElementById('summaryView').innerHTML = `
    <div class="summary-lead">
      <div class="stat"><div class="label">综合结论</div><div class="value ${winnerClass}">${winner}</div></div>
      <div class="stat"><div class="label">综合 GSB</div><div class="value">${formatGsb(overall.gsb)}</div></div>
      <div class="stat"><div class="label">完成题目</div><div class="value">${completed} / ${DATA.questions.length}</div></div>
    </div>
    <div class="section-title">分维度 GSB</div>
    <div class="table-wrap"><table>
      <thead><tr><th>一级维度</th><th>有效题</th><th>A</th><th>B</th><th>SameBad</th><th>SameGood</th><th>Similar</th><th>GSB</th><th>结论</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="section-title">口径</div>
    <p class="dimension-desc">模型A=${escapeHtml(DATA.models.a)}，模型B=${escapeHtml(DATA.models.b)}。GSB=(B + 0.5×Similar) ÷ (A + 0.5×Similar)，其中 Similar=SameBad+SameGood。GSB&gt;1 表示模型B占优，GSB&lt;1 表示模型A占优。</p>`;
}
function renderGuide() {
  document.getElementById('guideView').innerHTML = `<div class="dimension-guide">${[...DIMENSIONS,OVERALL].map(dim => `
    <div class="guide-group"><h3>${dim.name}</h3><p>${dim.desc}</p>${dim.subs.map(x=>`<p><b>${x[1]}</b>：${x[2]}</p>`).join('')}</div>`).join('')}</div>`;
}
function renderAll() {
  ensureState(); renderNav(); renderQuestion(); renderSummary(); renderGuide(); saveState();
}
function setPanel(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.panel===name));
  document.getElementById('evaluatePanel').hidden=name!=='evaluate';
  document.getElementById('summaryPanel').hidden=name!=='summary';
  document.getElementById('guidePanel').hidden=name!=='guide';
  if(name==='summary') renderSummary();
}
function download(name,text,type='text/plain;charset=utf-8') {
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvEscape(value) {
  const s=String(value??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function feedbackExportValues(q) {
  const feedback = state.results[q.id].dimensionFeedback || blankDimensionFeedback();
  if (feedback.status === 'no_issue') return ['没有问题','','','','',''];
  if (feedback.status !== 'issue') return ['未反馈','','','','',''];
  const issueLabels = feedback.issueTypes.map(id => FEEDBACK_ISSUES.find(item => item[0] === id)?.[1] || id);
  const dimensionLabels = feedback.dimensionIds.map(id => DIMENSIONS.find(dim => dim.id === id)?.name || id);
  const subdimensionLabels = feedback.subdimensionIds.map(value => {
    const [dimId,subId] = value.split(':');
    const dim = DIMENSIONS.find(item => item.id === dimId);
    const sub = dim?.subs.find(item => item[0] === subId);
    return dim && sub ? dim.name + ' > ' + sub[1] : value;
  });
  return [
    '有问题',
    issueLabels.join('；'),
    dimensionLabels.join('；'),
    subdimensionLabels.join('；'),
    feedback.suggestedDimension,
    feedback.note
  ];
}
function exportDetails() {
  const lines=[['题目序号','原题ID','一级维度','二级维度参考','选择','模型A','模型B','维度设置反馈','问题类型','涉及一级维度','涉及二级维度','建议新增维度','反馈说明']];
  DATA.questions.forEach(q=>[...DIMENSIONS,OVERALL].forEach(dim=>{
    if (!dimensionApplies(q,dim)) return;
    const r=state.results[q.id].dimensions[dim.id];
    lines.push([q.sequence,q.id,dim.name,dim.subs.map(x=>x[1]).join('；'),r.verdict,DATA.models.a,DATA.models.b,...feedbackExportValues(q)]);
  }));
  download('r2v_15题_完整评测与维度反馈.csv','\ufeff'+lines.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv;charset=utf-8');
}
function exportSummary() {
  const lines=[['一级维度','有效题','A','B','SameBad','SameGood','Similar','GSB','结论']];
  [...DIMENSIONS,OVERALL].forEach(dim=>{const s=statsFor(dim.id);lines.push([dim.name,s.valid,s.A,s.B,s.SameBad,s.SameGood,s.similar,formatGsb(s.gsb),winnerFromGsb(s.gsb)[0]]);});
  download('r2v_15题_GSB汇总.csv','\ufeff'+lines.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv;charset=utf-8');
}
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(text) { const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800); }

document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>setPanel(tab.dataset.panel));
document.getElementById('blindToggle').onclick=()=>{blind=!blind;document.body.classList.toggle('blind',blind);saveState();toast(blind?'已隐藏模型名称':'已显示模型名称');};
document.getElementById('syncPlay').onclick=()=>{
  const a=document.getElementById('videoA'),b=document.getElementById('videoB');
  if(!a||!b)return;
  if(a.paused&&b.paused){const t=Math.min(a.currentTime||0,b.currentTime||0);a.currentTime=t;b.currentTime=t;Promise.allSettled([a.play(),b.play()]);}
  else {a.pause();b.pause();}
};
document.getElementById('exportCsv').onclick=exportDetails;
window.addEventListener('beforeunload',saveState);
renderAll();
